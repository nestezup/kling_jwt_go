version: '3.8'
services:
  jwt-server:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "18080:18080"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18080/generate-token"]
      interval: 30s
      timeout: 10s
      retries: 3 